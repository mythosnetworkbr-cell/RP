name: Build NYX GameMode

on:
  push:
    paths:
      - 'nyx_build/**'
      - '.github/workflows/build-nyx-gamemode.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Pawn compiler
        run: |
          curl -L --fail -o pawnc.tar.gz https://github.com/openmultiplayer/compiler/releases/download/v3.10.11/pawnc-3.10.11-linux.tar.gz
          mkdir -p pawnc
          tar -xzf pawnc.tar.gz -C pawnc

      - name: Get SA-MP includes
        run: |
          git clone --depth 1 https://github.com/openmultiplayer/omp-stdlib.git omp-stdlib
          mkdir -p nyx_build/include
          cp omp-stdlib/*.inc nyx_build/include/

      - name: Compile NYX
        working-directory: nyx_build/gamemodes
        run: |
          COMPILER=$(find ../../pawnc -type f -name pawncc | head -1)
          test -n "$COMPILER"
          chmod +x "$COMPILER"
          export LD_LIBRARY_PATH="$(dirname "$COMPILER")/../lib:${LD_LIBRARY_PATH}"
          "$COMPILER" "nyx.pwn" "-i../include" "-;+" "-(+" "-Z-" "-d0" "-O2" "-t4" "-o:nyx"

      - name: Verify AMX
        run: |
          test -s nyx_build/gamemodes/nyx.amx
          file nyx_build/gamemodes/nyx.amx
          ls -lh nyx_build/gamemodes/nyx.amx

      - name: Assemble NYX server package
        run: |
          mkdir -p release/gamemodes
          cp nyx_build/gamemodes/nyx.amx release/gamemodes/nyx.amx
          cp nyx_build/server.cfg release/server.cfg
          test -s release/gamemodes/nyx.amx
          grep -q '^gamemode0 nyx 1$' release/server.cfg
          grep -q '^port 10961$' release/server.cfg
          cd release
          zip -r ../nyx-roleplay-server.zip .

      - name: Upload NYX server package
        uses: actions/upload-artifact@v4
        with:
          name: nyx-roleplay-server
          path: nyx-roleplay-server.zip
          if-no-files-found: error
