name: Build MYTHØS SA-MP Client

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-mythos-client.yml'
      - 'client-manifest.json'

permissions:
  contents: write

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout launcher repository
        uses: actions/checkout@v4

      - name: Checkout open-source SA-MP Mobile 2.11 source
        uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: GTA-2.11
          path: mythos-client

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare client source
        working-directory: mythos-client
        shell: bash
        run: |
          set -euo pipefail
          unzip -o app/src/main/cpp/cpp.zip -d app/src/main/cpp

          if [ -f app/src/main/cpp/samp_widgets/playertablist.h ] && [ ! -f app/src/main/cpp/samp_widgets/playerTabList.h ]; then
            cp app/src/main/cpp/samp_widgets/playertablist.h app/src/main/cpp/samp_widgets/playerTabList.h
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('build.gradle.kts')
          text = root.read_text()
          text = text.replace('        maven { url = uri("https://mint.splunk.com/gradle/") }\n', '')
          root.write_text(text)
          app = Path('app/build.gradle.kts')
          text = app.read_text()
          text = text.replace('applicationId = "com.gta.game"', 'applicationId = "br.com.mythos.sampclient"')
          text = re.sub(r'versionCode = \d+', 'versionCode = 2', text)
          text = re.sub(r'versionName = "[^"]+"', 'versionName = "1.0.1"', text)
          text = text.replace('    id("com.google.gms.google-services")\n', '')
          text = text.replace('    id("com.google.firebase.crashlytics")\n', '')
          text = re.sub(r'\n\s*firebaseCrashlytics\s*\{.*?\n\s*\}', '', text, flags=re.S)
          text = re.sub(r'^\s*implementation\("com\.google\.firebase:[^\n]+\)\n', '', text, flags=re.M)
          text = re.sub(r'^\s*implementation\(platform\("com\.google\.firebase:[^\n]+\)\)\n', '', text, flags=re.M)
          app.write_text(text)

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          marker = '<intent-filter>\n                <action android:name="android.intent.action.MAIN" />'
          if marker in m and 'android.intent.action.VIEW' not in m:
              m = m.replace(marker, '<intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="samp" />\n            </intent-filter>\n            ' + marker, 1)
          manifest.write_text(m)
          PY

      - name: Build client APK
        working-directory: mythos-client
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" ../mythos-samp-mobile-2.11-v1.0.1.apk

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s mythos-samp-mobile-2.11-v1.0.1.apk
          sha256sum mythos-samp-mobile-2.11-v1.0.1.apk

      - name: Publish workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mythos-samp-mobile-2.11-v1.0.1
          path: mythos-samp-mobile-2.11-v1.0.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mythos-client-v1.0.1
          name: MYTHØS SA-MP Mobile 2.11 v1.0.1
          body: Built from the public SAMP-Mobile GTA-2.11 source for the MYTHØS project. This release intentionally bumps the Android version so the launcher updates an older installed client.
          files: mythos-samp-mobile-2.11-v1.0.1.apk
          make_latest: false
