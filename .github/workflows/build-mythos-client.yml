name: Build MYTHØS SA-MP Client

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-mythos-client.yml'

permissions:
  contents: write

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout launcher repository
        uses: actions/checkout@v4

      - name: Checkout authorized SA-MP Mobile source
        uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: GTA-2.11
          path: mythos-client

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare MYTHØS client
        working-directory: mythos-client
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('applicationId = "com.gta.game"', 'applicationId = "br.com.mythos.sampclient"')
          s = s.replace('    id("com.google.gms.google-services")\n', '')
          s = s.replace('    id("com.google.firebase.crashlytics")\n', '')
          s = re.sub(r'\n\s*firebaseCrashlytics\s*\{.*?\n\s*\}', '', s, flags=re.S)
          s = re.sub(r'^\s*implementation\("com\.google\.firebase:[^\n]+\)\n', '', s, flags=re.M)
          s = re.sub(r'^\s*implementation\(platform\("com\.google\.firebase:[^\n]+\)\)\n', '', s, flags=re.M)

          marker = '    buildTypes {\n'
          signing = "\n".join([
              '    signingConfigs {',
              '        create("release") {',
              '            storeFile = file("mythos-release.keystore")',
              '            storePassword = "mythos123"',
              '            keyAlias = "mythos"',
              '            keyPassword = "mythos123"',
              '        }',
              '    }',
              '',
          ])
          if marker in s and 'create("release")' not in s:
              s = s.replace(marker, signing + marker, 1)
          s = s.replace('        release {\n', '        release {\n            signingConfig = signingConfigs.getByName("release")\n', 1)
          p.write_text(s)
          PY

          keytool -genkeypair -v \
            -keystore app/mythos-release.keystore \
            -alias mythos -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mythos123 -keypass mythos123 \
            -dname "CN=MYTHOS NETWORK, OU=RP, O=MYTHOS NETWORK, L=BR, ST=SP, C=BR"

          # Fix the launcher black strip on ultrawide landscape displays.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/res/layout/main_activity.xml')
          s = p.read_text()
          if '<FrameLayout' not in s:
              s = s.replace(
                  '<RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"',
                  '<FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"', 1)
              s = s.replace(
                  '    android:background="@drawable/background"\n    android:padding="@dimen/margin_medium">',
                  '    android:background="#000000">\n\n    <ImageView\n        android:layout_width="match_parent"\n        android:layout_height="match_parent"\n        android:src="@drawable/download_background"\n        android:scaleType="centerCrop"\n        android:contentDescription="@null" />\n\n    <RelativeLayout\n        android:layout_width="match_parent"\n        android:layout_height="match_parent"\n        android:padding="@dimen/margin_medium">', 1)
              s = s.rsplit('</RelativeLayout>', 1)[0] + '    </RelativeLayout>\n</FrameLayout>\n'
              p.write_text(s)
          PY

          mkdir -p app/src/main/res/values
          printf '%s\n' '<resources><string name="app_name">MYTHØS SA-MP Mobile 2.11</string></resources>' > app/src/main/res/values/strings.xml

          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace(
              'android:theme="@style/Theme.AppCompat.Light.NoActionBar.FullScreen"\n            android:exported="true">',
              'android:theme="@style/Theme.AppCompat.Light.NoActionBar.FullScreen"\n            android:resizeableActivity="true"\n            android:exported="true">', 1)
          p.write_text(s)
          PY

      - name: Build client APK
        working-directory: mythos-client
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/*.apk ../mythos-samp-mobile-2.11-v1.0.0.apk

      - name: Publish workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mythos-samp-mobile-2.11-v1.0.0
          path: mythos-samp-mobile-2.11-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mythos-client-v1.0.0
          name: MYTHØS SA-MP Mobile 2.11 v1.0.0
          body: MYTHØS SA-MP Mobile 2.11 client with ultrawide launcher background fix.
          files: mythos-samp-mobile-2.11-v1.0.0.apk
          make_latest: true
