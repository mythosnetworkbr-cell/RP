name: Build MYTHØS SA-MP Client

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-mythos-client.yml'

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout launcher repository
        uses: actions/checkout@v4
      - name: Checkout authorized SA-MP Mobile source
        uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: GTA-2.11
          path: mythos-client
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare MYTHØS client
        working-directory: mythos-client
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle')
          s = p.read_text()
          s = s.replace("id 'com.google.gms.google-services'\n", '')
          s = s.replace("id 'com.google.firebase.crashlytics'\n", '')
          s = s.replace("namespace 'com.samp.mobile'", "namespace 'br.com.mythos.sampclient'")
          s = s.replace('applicationId "com.samp.mobile"', 'applicationId "br.com.mythos.sampclient"')
          s = s.replace('versionCode 105', 'versionCode 1')
          s = s.replace('versionName "0.8.2.1"', 'versionName "1.0.0"')
          s = s.replace('storeFile file("../../keys/new.jks")', 'storeFile file("mythos-release.keystore")')
          s = s.replace('storePassword "123123"', 'storePassword "mythos123"')
          s = s.replace('keyAlias "key0"', 'keyAlias "mythos"')
          s = s.replace('keyPassword "123123"', 'keyPassword "mythos123"')
          s = re.sub(r'\n\s*firebaseCrashlytics\s*\{.*?\n\s*\}', '', s, flags=re.S)
          s = re.sub(r'^\s*implementation\s+\x27com\.google\.firebase:[^\n]+\n', '', s, flags=re.M)
          s = re.sub(r'^\s*implementation\s+platform\(\x27com\.google\.firebase:[^\n]+\n', '', s, flags=re.M)
          p.write_text(s)
          PY
          keytool -genkeypair -v -keystore app/mythos-release.keystore -alias mythos -keyalg RSA -keysize 2048 -validity 10000 -storepass mythos123 -keypass mythos123 -dname "CN=MYTHOS NETWORK, OU=RP, O=MYTHOS NETWORK, L=BR, ST=SP, C=BR"
          mkdir -p app/src/main/res/values
          printf '%s\n' '<resources><string name="app_name">MYTHØS SA-MP Mobile 2.11</string></resources>' > app/src/main/res/values/strings.xml
      - name: Build client APK
        working-directory: mythos-client
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Publish client APK
        uses: actions/upload-artifact@v4
        with:
          name: mythos-samp-mobile-2.11-v1.0.0
          path: mythos-client/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
