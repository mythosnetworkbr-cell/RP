name: Build MYTHØS SAMP - Full Branding

on:
  workflow_dispatch:
  push:
    paths:
      - 'SourceCodeSamp.zip.part-*'
      - '.github/workflows/build-mythos-samp-branded.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble source
        run: |
          set -e
          count=$(find . -maxdepth 1 -type f -name 'SourceCodeSamp.zip.part-*' | wc -l)
          test "$count" -ge 1
          ls -1v SourceCodeSamp.zip.part-* | xargs cat > SourceCodeSamp.zip
          unzip -t SourceCodeSamp.zip
          rm -rf source
          mkdir -p source
          unzip -q SourceCodeSamp.zip -d source

      - name: Apply complete MYTHØS SAMP branding
        working-directory: source
        run: |
          set -e
          RES="app/src/main/res"
          test -d "$RES"

          echo '== Replace visible News RP branding in all text files =='
          find . -type f ! -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            if grep -Iq . "$f"; then
              perl -0pi -e 's/News[[:space:]]+RP/MYTHØS SAMP/g; s/NEWS[[:space:]]+RP/MYTHØS SAMP/g; s/NewsRP/MYTHØS SAMP/g; s/NEWSRP/MYTHØS SAMP/g; s/News[[:space:]]+Roleplay/MYTHØS SAMP/g; s/NEWS[[:space:]]+ROLEPLAY/MYTHØS SAMP/g; s/MYTHØS[[:space:]]+ROLEPLAY/MYTHØS SAMP/g; s/MYTHOS[[:space:]]+ROLEPLAY/MYTHØS SAMP/g; s/MYTHØS[[:space:]]+RP/MYTHØS SAMP/g; s/MYTHOS[[:space:]]+RP/MYTHØS SAMP/g' "$f" || true
            fi
          done

          echo '== Force application name and icon =='
          find app/src/main -type f -name 'AndroidManifest.xml' -print0 | while IFS= read -r -d '' f; do
            sed -i -E 's/android:label="[^"]*"/android:label="MYTHØS SAMP"/g' "$f"
            if grep -q 'android:icon=' "$f"; then
              sed -i -E 's/android:icon="[^"]*"/android:icon="@drawable\/mythos_samp_icon"/g' "$f"
            else
              sed -i 's#<application#<application android:icon="@drawable/mythos_samp_icon"#' "$f"
            fi
          done

          find "$RES" -type f -name 'strings.xml' -print0 | while IFS= read -r -d '' f; do
            sed -i -E 's#(<string[[:space:]]+name="(app_name|application_name|app_label|launcher_name)"[^>]*>)[^<]*(</string>)#\1MYTHØS SAMP\3#g' "$f"
          done

          echo '== Generate launcher vector =='
          mkdir -p "$RES/drawable" ../branding
          cat > "$RES/drawable/mythos_samp_icon.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#080510" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#7B1CFF" android:pathData="M54,11L67,27L63,25L59,34L54,27L49,34L45,25L41,27z"/>
              <path android:fillColor="#C04EFF" android:pathData="M31,38L45,29L54,38L63,29L77,38L72,65L54,81L36,65z"/>
              <path android:fillColor="#080510" android:pathData="M44,40L54,48L64,40L61,60L54,67L47,60z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M23,88h62v4h-62z"/>
          </vector>
          XML

          echo '== Install image tooling and create new logo =='
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

          cat > mythos-samp-logo.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05030a"/><stop offset="1" stop-color="#18002f"/></linearGradient>
              <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7b1cff"/><stop offset=".55" stop-color="#c04eff"/><stop offset="1" stop-color="#8a2be2"/></linearGradient>
            </defs>
            <rect width="1600" height="500" rx="90" fill="url(#bg)"/>
            <path d="M120 210L185 165L250 210L315 165L380 210L355 330L250 405L145 330z" fill="url(#p)"/>
            <path d="M200 220L250 260L300 220L284 315L250 350L216 315z" fill="#080510"/>
            <text x="450" y="285" font-family="Arial Black,Arial,sans-serif" font-size="150" font-weight="900" fill="#fff">MYTHØS</text>
            <text x="455" y="390" font-family="Arial Black,Arial,sans-serif" font-size="82" font-weight="900" letter-spacing="26" fill="#c04eff">SAMP</text>
          </svg>
          SVG
          convert -background none mythos-samp-logo.svg mythos-samp-logo.png
          cp mythos-samp-logo.svg ../branding/mythos-samp-logo.svg
          cp mythos-samp-logo.png ../branding/mythos-samp-logo.png

          cat > mythos-samp-icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05030a"/><stop offset="1" stop-color="#18002f"/></linearGradient>
              <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7b1cff"/><stop offset=".55" stop-color="#c04eff"/><stop offset="1" stop-color="#8a2be2"/></linearGradient>
            </defs>
            <rect width="1024" height="1024" rx="190" fill="url(#bg)"/>
            <rect x="24" y="24" width="976" height="976" rx="175" fill="none" stroke="#c04eff" stroke-width="18"/>
            <path d="M512 115L620 250L585 232L550 295L512 245L474 295L439 232L404 250z" fill="url(#p)"/>
            <path d="M290 350L425 270L512 350L599 270L734 350L690 610L512 770L334 610z" fill="url(#p)"/>
            <path d="M405 365L512 450L619 365L585 570L512 640L439 570z" fill="#080510"/>
            <text x="512" y="845" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="112" font-weight="900" fill="#fff">MYTHØS</text>
            <text x="512" y="930" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="58" font-weight="900" letter-spacing="15" fill="#c04eff">SAMP</text>
          </svg>
          SVG
          convert -background none mythos-samp-icon.svg mythos-samp-icon.png
          cp mythos-samp-icon.svg ../branding/mythos-samp-icon.svg
          cp mythos-samp-icon.png ../branding/mythos-samp-icon.png

          echo '== Replace the actual legacy image resources =='
          find "$RES" -type f -print0 | while IFS= read -r -d '' f; do
            base=$(basename "$f" | tr '[:upper:]' '[:lower:]')
            case "$base" in
              *news_rp_logo*.png|*newsrp_logo*.png) cp mythos-samp-icon.png "$f" ;;
              *news_rp_wordmark*.png|*newsrp_wordmark*.png) cp mythos-samp-logo.png "$f" ;;
            esac
          done

          echo '== Replace launcher image resources =='
          find "$RES" -type f \( -iname 'ic_launcher*.png' -o -iname 'launcher_icon*.png' -o -iname 'app_icon*.png' -o -iname 'icon.webp' \) -print0 | while IFS= read -r -d '' f; do
            convert mythos-samp-icon.png "$f" || cp mythos-samp-icon.png "$f" || true
          done

          echo '== Fail if legacy visible text remains =='
          if grep -RIni --exclude-dir=.git -a -E 'News[[:space:]]*RP|NewsRP|News[[:space:]]*Roleplay|MYTHOS[[:space:]]+RP|MYTHØS[[:space:]]+RP|MYTHOS[[:space:]]+ROLEPLAY|MYTHØS[[:space:]]+ROLEPLAY' .; then
            echo 'ERROR: legacy branding remains in source.'
            exit 1
          fi
          echo 'Branding scan passed.'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;27.0.12077973"

      - name: Make Gradle executable
        working-directory: source
        run: chmod +x gradlew

      - name: Build MYTHØS SAMP APK
        working-directory: source
        env:
          ANDROID_NDK_VERSION: 27.0.12077973
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          set -e
          APK=$(find source/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -s "$APK"
          echo "APK=$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload MYTHØS SAMP APK
        uses: actions/upload-artifact@v4
        with:
          name: mythos-samp-branded-apk
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload MYTHØS SAMP branding
        uses: actions/upload-artifact@v4
        with:
          name: mythos-samp-branding
          path: branding/
          if-no-files-found: error
          retention-days: 30
