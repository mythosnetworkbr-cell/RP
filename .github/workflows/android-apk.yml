name: MYTHØS SAMP Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mythos-samp-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-client:
    name: Build SA-MP 2.11 Client
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout client source
        run: git clone --depth 1 --branch GTA-2.11 https://github.com/kuzia15/SAMP-Mobile.git client-src
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install client Android SDK
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;26.2.11394342' 'cmake;3.22.1'
      - name: Fix case-sensitive SA-MP widget include
        working-directory: client-src
        run: |
          set -e
          HEADER='app/src/main/cpp/samp/gui/samp_widgets/playertablist.h'
          test -f "$HEADER"
          sed -i 's#samp_widgets/playerTabList\.h#samp_widgets/playertablist.h#g' app/src/main/cpp/samp/gui/gui.h
          grep -F '#include "samp_widgets/playertablist.h"' app/src/main/cpp/samp/gui/gui.h
      - name: Build SA-MP 2.11 release APK
        working-directory: client-src
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify client APK
        run: |
          set -e
          APK="client-src/app/build/outputs/apk/release/GTA-2.11-release.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Replace stable client release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete client-2.11 --yes --cleanup-tag || true
          gh release create client-2.11 \
            --title 'MYTHØS SA-MP 2.11 Client' \
            --notes 'SA-MP 2.11 ARM64 client built from the public GTA-2.11 source. Cache path: /storage/emulated/0/GTA/' \
            client-src/app/build/outputs/apk/release/GTA-2.11-release.apk
      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: mythos-samp-client-2.11-${{ github.run_number }}
          path: client-src/app/build/outputs/apk/release/GTA-2.11-release.apk
          if-no-files-found: error
          retention-days: 30

  build-launcher:
    name: Build MYTHØS SAMP APK
    needs: build-client
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install launcher Android SDK components
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply Mythos SAMP branding
        run: npm run brand:samp
      - name: Patch launcher server selection
        run: node scripts/patch-server-buttons.js
      - name: Generate Mythos SAMP icon
        run: node scripts/generate-icon.js
      - name: Generate bundled Brazilian beat
        run: node scripts/generate-music.js
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build release APK locally
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify launcher APK
        run: |
          set -e
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Upload Mythos SAMP APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mythos-samp-2.6.0-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Build summary
        if: always()
        run: |
          echo '### MYTHØS SAMP 2.6.0' >> "$GITHUB_STEP_SUMMARY"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo 'APK Release gerado e validado.' >> "$GITHUB_STEP_SUMMARY"
            echo "SHA-256: $(sha256sum android/app/build/outputs/apk/release/app-release.apk | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'APK não foi gerado.' >> "$GITHUB_STEP_SUMMARY"
          fi
