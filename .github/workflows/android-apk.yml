name: MYTHØS RP Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          package-manager-cache: false

      - name: Verify Node.js
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install latest Expo/EAS CLI
        run: npm install --global eas-cli@latest

      - name: Validate Expo project
        run: npx expo config --type public

      - name: Link EAS project non-interactively
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas init --force --non-interactive
          echo '--- app.json after EAS init ---'
          cat app.json
          echo '--- EAS project info ---'
          eas project:info --non-interactive
          echo '--- EAS config ---'
          eas config --platform android --profile preview --json --non-interactive

      - name: Build preview APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Build summary
        if: always()
        run: |
          echo 'MYTHØS RP APK build finished.'
          echo 'Check the EAS build URL above for the APK artifact.'
