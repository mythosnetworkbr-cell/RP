name: MYTHØS RP Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mythos-rp-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          package-manager-cache: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install latest EAS CLI
        run: npm install --global eas-cli@latest

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Link and verify EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo 'EXPO_TOKEN is missing'; exit 1; }
          eas init --force --non-interactive
          echo '=== app.json ==='
          cat app.json
          echo '=== EAS project ==='
          eas project:info --non-interactive
          echo '=== EAS config ==='
          eas config --platform android --profile preview --json --non-interactive

      - name: Build preview APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Build summary
        if: always()
        run: |
          echo 'MYTHØS RP Android build finished.'
          echo 'If successful, the EAS output above contains the APK artifact URL.'
