name: MYTHØS RP Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mythos-rp-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Patch launcher server selection
        run: node scripts/patch-server-buttons.js
      - name: Generate launcher icon
        run: node scripts/generate-icon.js
      - name: Generate bundled Brazilian beat
        run: node scripts/generate-music.js
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build release APK locally
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: |
          set -e
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mythos-launcher-2.5.1-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Build summary
        if: always()
        run: |
          echo '### MYTHØS Launcher 2.5.1' >> "$GITHUB_STEP_SUMMARY"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo 'APK Release gerado e validado.' >> "$GITHUB_STEP_SUMMARY"
            echo "SHA-256: $(sha256sum android/app/build/outputs/apk/release/app-release.apk | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'APK não foi gerado.' >> "$GITHUB_STEP_SUMMARY"
          fi
